name: Update Playlist

on:
  schedule:
    # Run every 6 hours (at :00 of hours 0, 6, 12, 18 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure proxy URL
        run: |
          # Use the Cloudflare Worker URL from secrets, or a default
          if [ -n "${{ secrets.PROXY_URL }}" ]; then
            echo "PROXY_TEMPLATE=${{ secrets.PROXY_URL }}/proxy?url={url}" >> $GITHUB_ENV
          else
            echo "PROXY_TEMPLATE=https://my-worker.workers.dev/proxy?url={url}" >> $GITHUB_ENV
            echo "::warning::PROXY_URL secret not set -- using placeholder. Set it in repo Settings > Secrets."
          fi

      - name: Build playlist
        run: |
          python playlist_builder.py \
            --output playlist.m3u \
            --append \
            --cache .playlist_cache.json

      - name: Count entries
        id: count
        run: |
          COUNT=$(grep -c "^#EXTINF" playlist.m3u || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "New playlist has $COUNT entries"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the playlist and cache
          git add playlist.m3u .playlist_cache.json

          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit -- playlist is up to date"
          else
            git commit -m "chore: update playlist (${{ steps.count.outputs.count }} entries)

Auto-updated by GitHub Actions at $(date -u +"%Y-%m-%d %H:%M UTC")

Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
            git push
            echo "Committed and pushed updates"
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== Playlist Update Summary ==="
          echo "Total entries: ${{ steps.count.outputs.count }}"
          echo "Schedule: Every 6 hours"
          echo "Proxy: $PROXY_TEMPLATE"
          echo "==============================="

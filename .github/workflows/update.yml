name: Update Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure proxy URL
        env:
          PROXY_SECRET: ${{ secrets.PROXY_URL }}
        run: |
          if [ -n "$PROXY_SECRET" ]; then
            echo "PROXY_TEMPLATE=${PROXY_SECRET}/proxy?url={url}" >> "$GITHUB_ENV"
          else
            echo "PROXY_TEMPLATE=https://my-worker.workers.dev/proxy?url={url}" >> "$GITHUB_ENV"
            echo "::warning::PROXY_URL secret not set -- using placeholder"
          fi

      - name: Build playlist
        run: python playlist_builder.py --output playlist.m3u --append --cache .playlist_cache.json

      - name: Count entries
        id: count
        run: |
          COUNT=$(grep -c "^#EXTINF" playlist.m3u || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u .playlist_cache.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update playlist"
          git push
